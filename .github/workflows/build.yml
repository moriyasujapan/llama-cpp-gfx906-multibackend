name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      dockerfile:
        description: どちらをビルドするか
        type: choice
        options:
          - Dockerfile.upstream
          - Dockerfile.turboquant
        default: Dockerfile.upstream

jobs:
  # GitHub ホストランナーは空き14GB程度 / 実行6時間上限なので、
  # 15GB超のイメージをここでビルドしきることはできない。
  # push 時は「構文」と「参照先が実在するか」だけを検証する。
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: hadolint (Dockerfile.upstream)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile.upstream
          failure-threshold: error

      - name: hadolint (Dockerfile.turboquant)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile.turboquant
          failure-threshold: error

      - name: 参照している上流タグ / リリースが実在するか
        run: |
          set -euo pipefail

          arg_default() {
            sed -n "s/^ARG $2=//p" "$1" | head -n1
          }

          check_tag() {
            if git ls-remote --exit-code --tags \
                 "https://github.com/$1.git" "refs/tags/$2" >/dev/null; then
              echo "ok:      $1@$2"
            else
              echo "MISSING: $1@$2"
              exit 1
            fi
          }

          check_tag ggml-org/llama.cpp \
            "$(arg_default Dockerfile.upstream LLAMACPP_TAG)"
          check_tag AtomicBot-ai/atomic-llama-cpp-turboquant \
            "$(arg_default Dockerfile.turboquant TURBOQUANT_TAG)"

          lsv="$(arg_default Dockerfile.upstream LLAMA_SWAP_VERSION)"
          url="https://github.com/mostlygeek/llama-swap/releases/download"
          url="${url}/v${lsv}/llama-swap_${lsv}_linux_amd64.tar.gz"
          if curl -sfI -o /dev/null -L "$url"; then
            echo "ok:      llama-swap v${lsv}"
          else
            echo "MISSING: llama-swap v${lsv}"
            exit 1
          fi

  # 実ビルドは self-hosted ランナー (GPU 不要 / ディスク 80GB 程度と数時間) 向け。
  # ラベル self-hosted のランナーが無いリポジトリでは queue に残るだけなので、
  # 手動起動 (workflow_dispatch) のときだけ動かす。
  build:
    if: github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v4

      - name: docker build
        env:
          DOCKERFILE: ${{ inputs.dockerfile }}
        run: |
          set -euo pipefail
          variant="${DOCKERFILE#Dockerfile.}"
          tag="llama-swap-${variant}:ci-${GITHUB_SHA:0:7}"
          docker build -t "$tag" -f "$DOCKERFILE" .
          docker images "$tag"
