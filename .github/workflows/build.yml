name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      dockerfile:
        description: どちらをビルドするか
        type: choice
        options: [Dockerfile.upstream, Dockerfile.turboquant]
        default: Dockerfile.upstream

jobs:
  # GitHub ホストランナーでは完走しない (ディスクも時間も足りない) ので、
  # push 時は構文と参照先の妥当性だけを検証する。
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Dockerfile の構文チェック
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile.upstream
          failure-threshold: error

      - name: Dockerfile.turboquant の構文チェック
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile.turboquant
          failure-threshold: error

      - name: 参照している上流タグとベースイメージが実在するか
        run: |
          set -euo pipefail
          check_tag() {
            local repo="$1" tag="$2"
            if git ls-remote --exit-code --tags "https://github.com/${repo}.git" "refs/tags/${tag}" >/dev/null; then
              echo "ok: ${repo}@${tag}"
            else
              echo "missing: ${repo}@${tag}"; exit 1
            fi
          }
          check_tag ggml-org/llama.cpp \
            "$(grep -oP ARG LLAMACPP_TAG=KS+ Dockerfile.upstream)"
          check_tag AtomicBot-ai/atomic-llama-cpp-turboquant \
            "$(grep -oP ARG TURBOQUANT_TAG=KS+ Dockerfile.turboquant)"

          lsv="$(grep -oP ARG LLAMA_SWAP_VERSION=KS+ Dockerfile.upstream)"
          curl -sfI -o /dev/null -L \
            "https://github.com/mostlygeek/llama-swap/releases/download/v${lsv}/llama-swap_${lsv}_linux_amd64.tar.gz" \
            && echo "ok: llama-swap v${lsv}"

  # 実ビルドはセルフホストランナー向け。ラベル self-hosted を付けたランナーが
  # 無いリポジトリでは起動しないので、明示的に実行したときだけ動かす。
  build:
    if: github.event_name == workflow_dispatch
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v4

      - name: ビルド
        run: |
          set -euo pipefail
          df="${{ inputs.dockerfile }}"
          tag="llama-swap-$(basename "$df" | sed s/^Dockerfile.//):ci-${GITHUB_SHA::7}"
          docker build -t "$tag" -f "$df" .
          docker images "$tag"
